plugins { id 'com.android.application' }
android {
 namespace 'com.example.chineseocr'
 compileSdk 35
 defaultConfig {
   applicationId 'com.example.chineseocr'
   minSdk 26
   targetSdk 34
   testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
   versionCode 3
   versionName '0.4.0-mineru-onnx-experimental'
   // Emulator tests need x86_64. Build Samsung arm64-only with -PmineruArm64Release=true.
   if (project.hasProperty('mineruArm64Release')) { ndk { abiFilters 'arm64-v8a' } }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
 implementation 'com.belerweb:pinyin4j:2.5.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
}
