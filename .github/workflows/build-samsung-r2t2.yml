name: Build Samsung A16 Confucius4-R2T2 APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - build-r2t2-samsung-a16-20261124
    paths:
      - 'samsung-r2t2/**'
      - '.github/workflows/build-samsung-r2t2.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Flutter
        run: flutter --version
      - name: Create Android scaffold
        working-directory: samsung-r2t2
        run: |
          flutter create --platforms=android --project-name=r2t2_live_chinese --org=org.livechinese .
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/org/livechinese/r2t2_live_chinese/MainActivity.kt
          cp android_overrides/SubtitleOverlayService.kt android/app/src/main/kotlin/org/livechinese/r2t2_live_chinese/SubtitleOverlayService.kt
          rm -f test/widget_test.dart
      - name: Install and verify Android engine
        working-directory: samsung-r2t2
        run: python3 scripts/prepare_android_libs.py
      - name: Download and verify bundled offline model
        working-directory: samsung-r2t2
        run: |
          set -euo pipefail
          dest=android/app/src/main/assets/offline-model
          mkdir -p "$dest"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 'https://huggingface.co/cstr/confucius4-r2t2-GGUF/resolve/main/confucius4-r2t2-q4_k.gguf?download=true' -o "$dest/confucius4-r2t2-q4_k.gguf"
          curl --fail --location --retry 3 'https://huggingface.co/api/models/cstr/confucius4-r2t2-GGUF/tree/main' -o /tmp/model-tree.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          model = pathlib.Path("android/app/src/main/assets/offline-model/confucius4-r2t2-q4_k.gguf")
          entry = next(x for x in json.load(open("/tmp/model-tree.json")) if x["path"] == model.name)
          assert model.stat().st_size == entry["size"]
          with model.open("rb") as f:
              assert f.read(4) == b"GGUF"
              f.seek(0)
              assert hashlib.file_digest(f, "sha256").hexdigest() == entry["lfs"]["oid"]
          model.with_name("size.txt").write_text(str(entry["size"]))
          print("Verified model size and SHA256:", entry["size"], entry["lfs"]["oid"])
          PY
      - name: Dependencies
        working-directory: samsung-r2t2
        run: flutter pub get
      - name: Unit tests
        working-directory: samsung-r2t2
        run: flutter test
      - name: Build installable ARM64 APK
        working-directory: samsung-r2t2
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify model is included in APK
        working-directory: samsung-r2t2
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          model = pathlib.Path("android/app/src/main/assets/offline-model/confucius4-r2t2-q4_k.gguf")
          apk = pathlib.Path("build/app/outputs/flutter-apk/app-release.apk")
          with zipfile.ZipFile(apk) as z:
              name = "assets/offline-model/" + model.name
              assert z.getinfo(name).file_size == model.stat().st_size
              with z.open(name) as f:
                  assert f.read(4) == b"GGUF"
          assert apk.stat().st_size < 2 * 1024**3, "APK exceeds GitHub release asset limit"
          print("Verified bundled APK:", apk.stat().st_size)
          PY
      - name: Publish APK as a GitHub release (no artifact quota)
        working-directory: samsung-r2t2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create samsung-r2t2-a16-v0.7.0 \
            build/app/outputs/flutter-apk/app-release.apk#LiveChinese-R2T2-A16.apk \
            --target "$GITHUB_SHA" \
            --title "Live Chinese R2T2 – Samsung A16 v0.7.0" \
            --notes "Experimental ARM64 Mandarin overlay with font-dependent one-line minimum height and inline move and resize handles. Requires a separate phone on speaker. Includes the offline model in the APK; no network download on phone. Not device-tested." \
            --prerelease
