name: Build Samsung A16 Confucius4-R2T2 APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - build-r2t2-samsung-a16-20261124
    paths:
      - 'samsung-r2t2/**'
      - '.github/workflows/build-samsung-r2t2.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Flutter
        run: flutter --version
      - name: Create Android scaffold
        working-directory: samsung-r2t2
        run: |
          flutter create --platforms=android --project-name=r2t2_live_chinese --org=org.livechinese .
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
      - name: Install and verify Android engine
        working-directory: samsung-r2t2
        run: python3 scripts/prepare_android_libs.py
      - name: Dependencies
        working-directory: samsung-r2t2
        run: flutter pub get
      - name: Unit tests
        working-directory: samsung-r2t2
        run: flutter test
      - name: Build installable ARM64 APK
        working-directory: samsung-r2t2
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveChinese-R2T2-Samsung-A16-APK
          path: samsung-r2t2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
