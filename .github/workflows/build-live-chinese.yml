name: Build Live Chinese Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LiveChineseStream-A16/**'
      - '.github/workflows/build-live-chinese.yml'
      - '.github/scripts/smoke-live-chinese.sh'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages (preinstalled SDK manager)
        run: |
          sdk='/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager'
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download offline Qwen3-ASR 0.6B INT8 correction model
        shell: bash
        run: |
          set -euo pipefail
          base='https://huggingface.co/thieunv/sherpa-onnx-qwen3-asr-0.6B-int8/resolve/main'
          d='LiveChineseStream-A16/app/src/main/assets/qwen'
          mkdir -p "$d/tokenizer"
          for file in conv_frontend.onnx encoder.int8.onnx decoder.int8.onnx; do
            curl --fail --location --retry 5 --retry-delay 5 -o "$d/$file" "$base/$file"
          done
          for file in vocab.json merges.txt tokenizer_config.json; do
            curl --fail --location --retry 5 --retry-delay 5 -o "$d/tokenizer/$file" "$base/tokenizer/$file"
          done
          test $(wc -c < "$d/decoder.int8.onnx") -gt 700000000
          test $(wc -c < "$d/encoder.int8.onnx") -gt 150000000
          test $(wc -c < "$d/conv_frontend.onnx") -gt 40000000
          test $(wc -c < "$d/tokenizer/vocab.json") -gt 2000000
          du -h "$d"/*

      - name: Build debug APK
        working-directory: LiveChineseStream-A16
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Preserve ARM64 phone APK
        run: cp LiveChineseStream-A16/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/LiveChineseOffline-A16.apk"
      - name: Verify APK integrity and one-model contents
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/LiveChineseOffline-A16.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -18
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected network permission' >&2; exit 1
          fi
          unzip -Z1 "$apk" | grep -q '^assets/qwen/decoder.int8.onnx$'
          unzip -Z1 "$apk" | grep -q '^assets/qwen/encoder.int8.onnx$'
          unzip -Z1 "$apk" | grep -q '^assets/qwen/conv_frontend.onnx$'
          if unzip -Z1 "$apk" | grep -Eq '^assets/(model|punctuation|secondpass)/'; then
            echo 'Unexpected extra ASR/punctuation model present' >&2; exit 1
          fi
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          ls -lh "$apk"
      - name: Build emulator x86_64 smoke-test APK
        working-directory: LiveChineseStream-A16
        run: |
          gradle --no-daemon --stop || true
          gradle --no-daemon -PsmokeAbi=x86_64 clean assembleDebug
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/x86_64/libsherpa-onnx-jni.so'

      - name: Free CI disk space for Android emulator
        shell: bash
        run: |
          df -h /
          # GitHub hosted runners ship with many unrelated SDKs.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          # Clean intermediate Gradle output, but keep the emulator APK.
          cd LiveChineseStream-A16
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/LiveChineseOffline-x86_64.apk"
          rm -rf app/build/intermediates app/build/tmp .gradle
          df -h /

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator startup and microphone smoke test
        timeout-minutes: 12

        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          ram-size: 6144M
          heap-size: 768M
          disk-size: 4G
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/smoke-live-chinese.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LiveChineseOffline-A16-APK
          path: ${{ runner.temp }}/LiveChineseOffline-A16.apk
          if-no-files-found: error
          retention-days: 14
