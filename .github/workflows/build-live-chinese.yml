name: Build Live Chinese Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LiveChineseStream-A16/**'
      - '.github/workflows/build-live-chinese.yml'
      - '.github/scripts/smoke-live-chinese.sh'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages (preinstalled SDK manager)
        run: |
          sdk='/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager'
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download and verify bilingual Mandarin-English streaming int8 model
        shell: bash
        run: |
          set -euo pipefail
          base='https://huggingface.co/csukuangfj/sherpa-onnx-streaming-paraformer-bilingual-zh-en/resolve/main'
          mkdir -p LiveChineseStream-A16/app/src/main/assets/model
          cd LiveChineseStream-A16/app/src/main/assets/model
          for file in encoder.int8.onnx decoder.int8.onnx tokens.txt; do
            curl --fail --location --retry 5 --retry-delay 2 -o "$file" "${base}/${file}"
          done
          echo '81a70226a8934e6ed92aa1d4fc486b428b5398e2f2619ed4897b7294cab90e9a  encoder.int8.onnx' | sha256sum -c -
          echo 'f3cca9f77bb9d93c8fcbfb63ae617b6b1ee96818df3aa3b151c40658fe38594f  decoder.int8.onnx' | sha256sum -c -
          test $(wc -c < tokens.txt) -gt 50000
          file encoder.int8.onnx decoder.int8.onnx
          du -h *.onnx
      - name: Download and verify offline punctuation model only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LiveChineseStream-A16/app/src/main/assets/punctuation
          cd LiveChineseStream-A16/app/src/main/assets/punctuation
          curl --fail --location --retry 5 --retry-delay 3 -o model.int8.onnx 'https://huggingface.co/lorneluo/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8/resolve/main/model.int8.onnx'
          echo '65a3fb9f5ad7bfb96bf69e0dc4481df97f6ee60513c1d94ce981ba6effd524b1  model.int8.onnx' | sha256sum -c -
          du -h model.int8.onnx
      - name: Build debug APK
        working-directory: LiveChineseStream-A16
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Preserve ARM64 phone APK
        run: cp LiveChineseStream-A16/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/LiveChineseOffline-A16.apk"
      - name: Verify APK integrity and manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/LiveChineseOffline-A16.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -18
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected network permission' >&2
            exit 1
          fi
          unzip -l "$apk" | grep -E 'assets/(model|secondpass|punctuation)/.*(onnx|tokens.txt)'
          unzip -l "$apk" | grep -q 'assets/punctuation/model.int8.onnx'
          if unzip -Z1 "$apk" | grep -q 'assets/secondpass/'; then echo 'Unexpected SenseVoice second pass in APK' >&2; exit 1; fi
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          ls -lh "$apk"
      - name: Build emulator x86_64 smoke-test APK
        working-directory: LiveChineseStream-A16
        run: |
          gradle --no-daemon --stop || true
          gradle --no-daemon -PsmokeAbi=x86_64 clean assembleDebug
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/x86_64/libsherpa-onnx-jni.so'

      - name: Free CI disk space for Android emulator
        shell: bash
        run: |
          df -h /
          # GitHub hosted runners ship with many unrelated SDKs.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          # Clean intermediate Gradle output, but keep the emulator APK.
          cd LiveChineseStream-A16
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/LiveChineseOffline-x86_64.apk"
          rm -rf app/build/intermediates app/build/tmp .gradle
          df -h /

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator startup and microphone smoke test
        timeout-minutes: 12

        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          ram-size: 4096M
          heap-size: 768M
          disk-size: 2G
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/smoke-live-chinese.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LiveChineseOffline-A16-APK
          path: ${{ runner.temp }}/LiveChineseOffline-A16.apk
          if-no-files-found: error
          retention-days: 30
