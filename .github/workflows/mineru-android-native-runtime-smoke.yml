name: Smoke-test MinerU llama native runtime on Android emulator
on:
  workflow_dispatch:
  push:
    branches: [mineru-native-android-experimental]
    paths:
      - '.github/workflows/mineru-android-native-runtime-smoke.yml'
concurrency:
  group: mineru-android-native-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-emulator-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android emulator and NDK
        run: sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build git
      - name: Fetch upstream MinerU llama.cpp submodule
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/opendatalab/mineru-llama-cpp.git /tmp/mineru-llama-cpp
          git -C /tmp/mineru-llama-cpp submodule update --init --recursive --depth=1
      - name: Compile real llama.cpp Android x86_64 for emulator loader test
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/mineru-llama-cpp/third_party/llama.cpp -B /tmp/llama-android-x86 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_BACKEND_DL=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-android-x86 --target llama --parallel 3
          file "$(find /tmp/llama-android-x86 -type f -name libllama.so | head -1)"
      - name: Build tiny Android executable to dynamically load real libllama engine
        run: |
          set -euo pipefail
          cat >/tmp/mineru-native-smoke.cpp <<'CPP'
          #include <cstdio>
          #include <dlfcn.h>
          int main() {
            void* library=dlopen("libllama.so",RTLD_NOW);
            if(!library){std::fprintf(stderr,"libllama dlopen failed: %s\n",dlerror());return 2;}
            typedef const char* (*Info)();
            typedef void (*Initialize)();
            auto info=reinterpret_cast<Info>(dlsym(library,"llama_print_system_info"));
            auto init=reinterpret_cast<Initialize>(dlsym(library,"llama_backend_init"));
            if(!info||!init){std::fprintf(stderr,"MinerU llama.cpp native API symbols unavailable\n");return 3;}
            init();
            std::printf("Android llama engine started: %s\n",info());
            dlclose(library);return 0;
          }
          CPP
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang++" \
             /tmp/mineru-native-smoke.cpp -o /tmp/mineru-native-smoke -ldl
          file /tmp/mineru-native-smoke
      - name: Reclaim compiler disk before starting Android emulator
        run: |
          set -euo pipefail
          mkdir -p /tmp/mineru-native-bundle
          find /tmp/llama-android-x86 -type f -name '*.so' -print0 | xargs -0 -r -I '{}' cp -f '{}' /tmp/mineru-native-bundle/
          cp /tmp/mineru-native-smoke /tmp/mineru-native-bundle/mineru-native-smoke
          rm -rf /tmp/llama-android-x86 /tmp/mineru-llama-cpp
          sudo rm -rf "$ANDROID_HOME/ndk/27.2.12479018"
          df -h / /tmp /home/runner
      - name: Enable KVM
        run: sudo chown "${USER}" /dev/kvm
      - name: Execute Android native library and CLI startup test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb shell 'mkdir -p /data/local/tmp/mineru-native'
            find /tmp/llama-android-x86 -type f -name '*.so' -print0 | while IFS= read -r -d '' so; do
              adb push "$so" /data/local/tmp/mineru-native/
            done
            adb push /tmp/mineru-native-bundle/mineru-native-smoke /data/local/tmp/mineru-native/mineru-native-smoke
            adb shell 'chmod +x /data/local/tmp/mineru-native/mineru-native-smoke'
            adb shell 'cd /data/local/tmp/mineru-native && LD_LIBRARY_PATH=. ./mineru-native-smoke' > /tmp/mineru-native-android-startup.log 2>&1
            grep -q 'Android llama engine started:' /tmp/mineru-native-android-startup.log
            head -n 35 /tmp/mineru-native-android-startup.log
            test -s /tmp/mineru-native-android-startup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MinerU-llama-Android-emulator-startup-log
          path: /tmp/mineru-native-android-startup.log
          if-no-files-found: warn
