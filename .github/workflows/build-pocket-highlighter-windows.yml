name: Build Pocket Highlighter Windows EXE
on:
  push:
    branches:
      - pocket-highlighter-windows-20261112
    paths-ignore:
      - 'windows-dist/**'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack Windows source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-build | Out-Null
          $parts = Get-Content -Raw windows-src/part0.txt,windows-src/part1.txt,windows-src/part2.txt
          $b64 = ($parts -join '').Trim()
          $b64 | Set-Content -NoNewline windows-build/source.base64
          @'
          import base64, hashlib
          from pathlib import Path
          s=Path("windows-build/source.base64").read_text().strip()
          wanted="abdb8cf3062675235e990c580ffea0cc618c5a47f66e3d7155582bd3f20795c1"
          options=[s] if len(s)%4==0 else (s[:i]+s[i+1:] for i in range(len(s)))
          for candidate in options:
              try:
                  data=base64.b64decode(candidate,validate=True)
                  if hashlib.sha256(data).hexdigest()==wanted:
                      Path("windows-build/source.tar.xz").write_bytes(data)
                      print("PASS: source archive checksum matches")
                      break
              except (ValueError,base64.binascii.Error):
                  pass
          else:
              raise RuntimeError("Source transfer checksum mismatch")
          '@ | python -
          tar -xJf windows-build/source.tar.xz -C windows-build
          if (-not (Test-Path windows-build/pocket_highlighter.py)) { throw "Missing Windows source" }
      - name: Install build libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows-build/requirements.txt pyinstaller==6.16.0
      - name: Verify source tests
        working-directory: windows-build
        shell: pwsh
        run: python -m unittest -v test_pocket.py
      - name: Build portable Windows executable
        working-directory: windows-build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PocketHighlighterWindows --collect-all fitz --collect-all docx pocket_highlighter.py
          if (-not (Test-Path dist/PocketHighlighterWindows.exe)) { throw "EXE missing" }
      - name: Smoke test executable on Windows runner
        shell: pwsh
        run: |
          $exe = (Resolve-Path windows-build/dist/PocketHighlighterWindows.exe).Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 9
          if ($p.HasExited) { throw "Windows app exited immediately with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output "PASS: Windows EXE launched and stayed running"
      - name: Commit portable EXE to build branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-dist | Out-Null
          Copy-Item windows-build/dist/PocketHighlighterWindows.exe windows-dist/PocketHighlighterWindows.exe
          Get-FileHash windows-dist/PocketHighlighterWindows.exe -Algorithm SHA256
          (Get-Item windows-dist/PocketHighlighterWindows.exe).Length
          git config user.name "Pocket Highlighter Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-dist/PocketHighlighterWindows.exe
          git commit -m "Add Windows Pocket Highlighter standalone executable"
          git push origin HEAD:pocket-highlighter-windows-20261112
