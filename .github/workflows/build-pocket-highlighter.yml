name: Build Pocket Highlighter APK
on:
  push:
    branches:
      - build-pocket-highlighter-20261112
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        shell: bash
        run: |
          cat pocket-build/source-parts/part{1,2,3,4}.txt | base64 --decode | tar -xJ -C pocket-build
          test -f pocket-build/app/build.gradle
          test -f pocket-build/app/src/main/AndroidManifest.xml
      - name: Correct PdfDocument lifecycle in Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pocket-build/app/src/main/java/com/pockethighlighter/ReaderActivity.java')
          s = p.read_text()
          old = "            try (PdfRenderer input = new PdfRenderer(fd);\n                 PdfDocument output = new PdfDocument()) {"
          new = "            try (PdfRenderer input = new PdfRenderer(fd)) {\n                PdfDocument output = new PdfDocument();\n                try {"
          assert s.count(old) == 1, "PDF resource site missing"
          s = s.replace(old, new)
          old = "                }\n            }\n        }\n    }\n\n    private void exportJpeg"
          new = "                }\n                } finally {\n                    output.close();\n                }\n            }\n        }\n    }\n\n    private void exportJpeg"
          assert s.count(old) == 1, "PDF close site missing"
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed small APK
        working-directory: pocket-build
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Save APK on isolated build branch (not workflow artifacts)
        shell: bash
        run: |
          mkdir -p pocket-build/install/encoded
          cp pocket-build/app/build/outputs/apk/release/app-release.apk pocket-build/install/PocketHighlighter.apk
          stat -c 'APK_SIZE_BYTES=%s' pocket-build/install/PocketHighlighter.apk
          sha256sum pocket-build/install/PocketHighlighter.apk
          xz -9e -T2 -c pocket-build/install/PocketHighlighter.apk | base64 -w0 | fold -w 4096 | split -d -a 3 -l 1 - pocket-build/install/encoded/part-
          git config user.name 'GitHub Actions APK Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pocket-build/install/PocketHighlighter.apk pocket-build/install/encoded/
          git commit -m 'Add compiled Pocket Highlighter APK'
          git push origin HEAD:build-pocket-highlighter-20261112
