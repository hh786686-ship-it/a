name: MinerU ONNX Android feasibility probe
on:
  push:
    branches: [mineru-native-android-experimental]
    paths: ['.github/workflows/mineru-onnx-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official MinerU 4 ONNX models
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          url='https://huggingface.co/api/models/opendatalab/MinerU-4_models_onnx/tree/main?recursive=true'
          req=urllib.request.Request(url,headers={'User-Agent':'MinerU-Android-Feasibility/1.0'})
          with urllib.request.urlopen(req,timeout=90) as f: data=json.load(f)
          matches=[{'path':x.get('path'),'size':x.get('size')} for x in data if x.get('path','').lower().endswith(('.onnx','.json','.txt','.yaml'))]
          print('TOTAL_MATCHES',len(matches))
          print(json.dumps(matches[:150],indent=2,ensure_ascii=False))
          with open('/tmp/mineru-model-list.json','w') as f:json.dump(matches,f)
          PY
      - name: Download real MinerU OCR models and inspect ONNX input/output
        shell: bash
        run: |
          set -eux
          mkdir -p /tmp/mineru-ocr
          curl -fL --retry 3 --max-time 180 -o /tmp/mineru-ocr/det.onnx https://huggingface.co/opendatalab/MinerU-4_models_onnx/resolve/main/OCR/paddleocr/ch_PP-OCRv6_tiny_det_infer.onnx
          curl -fL --retry 3 --max-time 180 -o /tmp/mineru-ocr/rec.onnx https://huggingface.co/opendatalab/MinerU-4_models_onnx/resolve/main/OCR/paddleocr/ch_PP-OCRv6_small_rec_infer.onnx
          python3 -m pip install --quiet onnxruntime==1.23.2
          python3 - <<'PY'
          import onnxruntime as ort
          for name in ('det','rec'):
            p='/tmp/mineru-ocr/'+name+'.onnx'
            sess=ort.InferenceSession(p,providers=['CPUExecutionProvider'])
            print('MODEL_NAME',name)
            print('MODEL_INPUTS',[(x.name,x.shape,x.type) for x in sess.get_inputs()])
            print('MODEL_OUTPUTS',[(x.name,x.shape,x.type) for x in sess.get_outputs()])
          PY
      - name: Check compatibility of ONNX Runtime Android package
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,zipfile,io
          url='https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.30.0/onnxruntime-android-1.30.0.aar'
          with urllib.request.urlopen(url,timeout=90) as resp: raw=resp.read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            libs=[x for x in z.namelist() if x.startswith('jni/') and x.endswith('.so')]
          print('ANDROID_RUNTIME_BYTES',len(raw))
          print('NATIVE_ARCHITECTURES',libs)
          assert any('arm64-v8a' in x for x in libs),'No arm64 runtime'
          PY
      - name: Summarize Android MinerU deployment limitations
        run: |
          echo "ONNX session tests only demonstrate model loadability on Linux CPU." >> "$GITHUB_STEP_SUMMARY"
          echo "They do not constitute a complete MinerU Android OCR pipeline or Android inference benchmark." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: MinerU-Android-model-feasibility
          path: /tmp/mineru-model-list.json
