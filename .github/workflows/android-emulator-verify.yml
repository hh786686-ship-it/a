name: Android emulator OCR and formatting verification
on:
  push:
    branches:
      - mlkit-offline-chinese-pinyin
  workflow_dispatch:
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and emulator
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Enable KVM
        run: |
          sudo chown ${USER} /dev/kvm
          ls -l /dev/kvm
      - name: Execute Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: ChineseOCR-Android
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p app/build/verified-docx
            adb pull /sdcard/Download/mlkit-verified-style-output.docx app/build/verified-docx/verified-style-output.docx
            test -s app/build/verified-docx/verified-style-output.docx
            adb pull /sdcard/Download/mlkit-verified-pdf-ocr-output.docx app/build/verified-docx/verified-pdf-ocr-output.docx
            test -s app/build/verified-docx/verified-pdf-ocr-output.docx
      - name: Independently validate exported Word document
        run: |
          python -m pip install --quiet python-docx
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          from docx import Document
          p = "ChineseOCR-Android/app/build/verified-docx/verified-style-output.docx"
          W = "{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "Corrupt DOCX archive"
              names = set(z.namelist())
              assert {"[Content_Types].xml", "_rels/.rels", "word/document.xml"} <= names
              root = ET.fromstring(z.read("word/document.xml"))
              ruby = root.findall(".//" + W + "ruby")
              assert len(ruby) == 2, f"Expected 2 Chinese ruby characters, got {len(ruby)}"
              ruby_pairs = []
              for node in ruby:
                  base = "".join(t.text or "" for t in node.findall(".//" + W + "rubyBase//" + W + "t"))
                  py = "".join(t.text or "" for t in node.findall(".//" + W + "rt//" + W + "t"))
                  ruby_pairs.append((base,py))
              assert ruby_pairs == [("你","nǐ"), ("好","hǎo")], ruby_pairs
              assert root.find(".//" + W + "b") is not None
              assert root.find(".//" + W + "u") is not None
              colors = [x.get(W+"val") for x in root.findall(".//" + W + "color")]
              assert "FF0000" in colors, f"Red source text was not preserved in export: {colors!r}"
              assert any(x.get(W+"val") == "yellow" for x in root.findall(".//" + W + "highlight")) or any(x.get(W+"fill") == "FFFF00" for x in root.findall(".//" + W + "shd"))
              assert "1" in "".join(t.text or "" for t in root.findall(".//" + W + "t"))
          doc = Document(p)
          assert len(doc.paragraphs) >= 2
          pdfdoc = "ChineseOCR-Android/app/build/verified-docx/verified-pdf-ocr-output.docx"
          with zipfile.ZipFile(pdfdoc) as z:
              assert z.testzip() is None
              assert {"[Content_Types].xml", "_rels/.rels", "word/document.xml"} <= set(z.namelist())
              xmlroot = ET.fromstring(z.read("word/document.xml"))
              bases = "".join(t.text or "" for t in xmlroot.findall(".//" + W + "rubyBase//" + W + "t"))
              assert "你好" in bases, f"OCR lost expected Chinese text: {bases!r}"
              assert len(xmlroot.findall(".//" + W + "ruby")) >= 2
          assert len(Document(pdfdoc).paragraphs) >= 2
          print("PASS: both emulator PDF OCR and DOCX-direct outputs are readable Word documents")
          PY
      - name: Render actual Word exports and verify one-page fit
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer poppler-utils
          fi
          mkdir -p /tmp/rendered-docx
          libreoffice -env:UserInstallation=file:///tmp/lo-chinese-ocr-check --headless --convert-to pdf --outdir /tmp/rendered-docx ChineseOCR-Android/app/build/verified-docx/verified-style-output.docx
          libreoffice -env:UserInstallation=file:///tmp/lo-chinese-ocr-check --headless --convert-to pdf --outdir /tmp/rendered-docx ChineseOCR-Android/app/build/verified-docx/verified-pdf-ocr-output.docx
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          for name in ("verified-style-output", "verified-pdf-ocr-output"):
              path = "/tmp/rendered-docx/" + name + ".pdf"
              reader = PdfReader(path)
              assert len(reader.pages) == 1, f"{name}: output overflowed to {len(reader.pages)} pages"
              assert reader.pages[0].mediabox.width > 500
              print("PASS: rendered Word export", name, "fits one A4 page")
          PY
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            ChineseOCR-Android/app/build/outputs/androidTest-results/connected/
            ChineseOCR-Android/app/build/reports/androidTests/connected/
            ChineseOCR-Android/app/build/verified-docx/
          if-no-files-found: warn
