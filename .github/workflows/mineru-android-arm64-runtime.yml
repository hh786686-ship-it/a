name: MinerU ARM64 native runtime smoke test
on:
  push:
    branches: [mineru-standard-arm64-native-port]
    paths: ['.github/workflows/mineru-android-arm64-runtime.yml','AndroidNativeLibProbe/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arm64-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch compiled MinerU-pinned llama.cpp ARM64 libraries
        uses: actions/download-artifact@v4
        with:
          name: mineru-pinned-llama-cpp-arm64-native
          repository: hh786686-ship-it/a
          run-id: '42500439439'
          github-token: ${{ github.token }}
          path: AndroidNativeLibProbe/app/src/main/jniLibs/arm64-v8a
      - name: Prepare Android ARM64 emulation and C++ runtime
        run: |
          set -euxo pipefail
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;arm64-v8a"
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" AndroidNativeLibProbe/app/src/main/jniLibs/arm64-v8a/
          ls -lh AndroidNativeLibProbe/app/src/main/jniLibs/arm64-v8a/
          if [ -e /dev/kvm ]; then sudo chown "$USER" /dev/kvm; fi
      - name: Confirm Android dynamic loader can load MinerU native dependencies
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          working-directory: AndroidNativeLibProbe
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MinerU-ARM64-runtime-load-test
          path: AndroidNativeLibProbe/app/build/reports/androidTests/
          if-no-files-found: warn
