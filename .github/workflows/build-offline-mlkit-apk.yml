name: Build Offline ML Kit Chinese Pinyin APK
on:
  push:
    branches:
      - mlkit-offline-chinese-pinyin
  workflow_dispatch:
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build offline OCR APK
        working-directory: ChineseOCR-Android
        run: gradle --no-daemon assembleDebug
      - name: Check APK
        run: |
          test -s ChineseOCR-Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify ChineseOCR-Android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Offline-MLKit-Chinese-Pinyin-APK
          path: ChineseOCR-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
