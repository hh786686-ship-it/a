name: Attempt exact MinerU 4 Standard runtime install on Android
on:
  workflow_dispatch:
  push:
    branches: [mineru-native-android-experimental]
    paths:
      - 'AndroidFullMinerUProbe/**'
      - '.github/workflows/full-mineru-standard-android-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Try to package unmodified MinerU Standard Python dependencies into Android ARM64
        working-directory: AndroidFullMinerUProbe
        run: gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee /tmp/mineru-standard-android-install.log
      - name: Show whether full MinerU Standard is packaged
        run: |
          test -s AndroidFullMinerUProbe/app/build/outputs/apk/debug/app-debug.apk
          echo "PASS: Unmodified MinerU Python package dependency resolution and APK packaging succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "Note: this alone does not prove Standard VLM inference works on the device." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MinerU-4-Standard-Android-install-attempt-logs
          path: /tmp/mineru-standard-android-install.log
          if-no-files-found: warn
