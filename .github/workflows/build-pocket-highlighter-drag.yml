name: Android Pocket Highlighter 1.3 Draggable Palette
on:
  push:
    branches:
      - pocket-highlighter-android-draggable-20261118
    paths-ignore:
      - 'pocket-drag/output/**'
  workflow_dispatch:
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project and apply panel fix
        shell: bash
        run: |
          mkdir -p pocket-v2/build
          cat pocket-v2/source/part{01,02,03,04,05,06}.txt | base64 --decode | tar -xJ -C pocket-v2/build
          python3 pocket-v2/patch-v12.py
          python3 pocket-drag/patch_drag_panel.py pocket-v2/build
          grep -q 'versionName .1.3.' pocket-v2/build/app/build.gradle
          grep -q 'Drag highlight color panel' pocket-v2/build/app/src/main/java/com/pockethighlighter/ReaderActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile signed and minified APK
        working-directory: pocket-v2/build
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p pocket-drag/output
          cp pocket-v2/build/app/build/outputs/apk/release/app-release.apk pocket-drag/output/PocketHighlighter_v1_3.apk
          unzip -t pocket-drag/output/PocketHighlighter_v1_3.apk | tail -n1
          stat -c 'APK_SIZE_BYTES=%s' pocket-drag/output/PocketHighlighter_v1_3.apk
          sha256sum pocket-drag/output/PocketHighlighter_v1_3.apk
      - name: Publish compiled APK to private GitHub branch
        shell: bash
        run: |
          git config user.name 'Pocket Highlighter Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pocket-drag/output/PocketHighlighter_v1_3.apk
          git commit -m 'Add compiled draggable-palette Android 1.3 APK'
          git push origin HEAD:pocket-highlighter-android-draggable-20261118
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator drag test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/test-pocket-drag.sh
