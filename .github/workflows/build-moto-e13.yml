name: Build Moto e13 32-bit APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-moto-e13.yml'
      - 'LiveChineseStream-A16/**'
      - 'android-v1.14/**'

permissions:
  contents: write

jobs:
  moto-e13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.9 source and apply v1.14 Android Go no-overlay support
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tag v1.9.0
          rm -rf LiveChineseStream-A16
          git archive v1.9.0 LiveChineseStream-A16 | tar -x
          test -f LiveChineseStream-A16/app/src/main/java/com/example/livechinesea16/CaptionService.java
          test -f LiveChineseStream-A16/app/src/main/java/com/example/livechinesea16/CallAudioAccessibilityService.java
          grep -q 'SYSTEM_ALERT_WINDOW' LiveChineseStream-A16/app/src/main/AndroidManifest.xml
          grep -q '1.9.0-call-experimental' LiveChineseStream-A16/app/build.gradle.kts
          cp android-v1.14/CaptionService.java LiveChineseStream-A16/app/src/main/java/com/example/livechinesea16/CaptionService.java
          cp android-v1.14/MainActivity.java LiveChineseStream-A16/app/src/main/java/com/example/livechinesea16/MainActivity.java
          cp android-v1.14/build.gradle.kts LiveChineseStream-A16/app/build.gradle.kts
          cp android-v1.13/AndroidManifest.xml LiveChineseStream-A16/app/src/main/AndroidManifest.xml
          cp android-v1.13/ModelStandbyService.java LiveChineseStream-A16/app/src/main/java/com/example/livechinesea16/ModelStandbyService.java
          echo 'Applied v1.14: recording starts with overlay denied, in-app live transcript, optional standby.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        shell: bash
        run: |
          set -o pipefail
          sdk='/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager'
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee "$RUNNER_TEMP/setup.log"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download offline Mandarin streaming model
        shell: bash
        run: |
          set -euo pipefail
          base='https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-zh-int8-2025-06-30/resolve/main'
          dir=LiveChineseStream-A16/app/src/main/assets/model
          mkdir -p "$dir"
          for file in encoder.int8.onnx decoder.onnx joiner.int8.onnx tokens.txt; do
            curl --fail --location --retry 5 --retry-delay 3 -o "$dir/$file" "$base/$file"
          done
          test "$(wc -c < "$dir/encoder.int8.onnx")" -gt 150000000
          test "$(wc -c < "$dir/decoder.onnx")" -gt 4000000
          test "$(wc -c < "$dir/joiner.int8.onnx")" -gt 700000
      - name: Build 32-bit Moto e13 APK
        working-directory: LiveChineseStream-A16
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -PsmokeAbi=armeabi-v7a --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Validate signature architecture and bundled model
        shell: bash
        run: |
          set -euo pipefail
          apk=LiveChineseStream-A16/app/build/outputs/apk/debug/app-debug.apk
          {
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -20
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "native-code: 'armeabi-v7a'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "versionName='1.14.0-android-go-no-overlay'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -F "android.permission.SYSTEM_ALERT_WINDOW"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F "com.example.livechinesea16.CaptionService"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F "com.example.livechinesea16.CallAudioAccessibilityService"
            unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libsherpa-onnx-jni.so'
            unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libonnxruntime.so'
            unzip -l "$apk" | grep -F 'assets/model/encoder.int8.onnx'
            unzip -l "$apk" | grep -F 'assets/model/decoder.onnx'
            unzip -l "$apk" | grep -F 'assets/model/joiner.int8.onnx'
            if unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/'; then echo 'Unexpected 64-bit native libraries' >&2; exit 1; fi
            ls -lh "$apk"
          } 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: Publish 32-bit APK directly to private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            apk=LiveChineseStream-A16/app/build/outputs/apk/debug/app-debug.apk
            name=LiveChineseOffline-v1.14-MotoE13-AndroidGo-32bit.apk
            cp "$apk" "$RUNNER_TEMP/$name"
            tag=moto-e13-v1.14.0
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$GITHUB_SHA" --title "Live Chinese Offline v1.14 - Moto e13 Android Go" --notes "v1.14 fixes Start listening on Android Go when Display over other apps permission is blocked. Offline microphone recognition and the in-app live searchable transcript work without an overlay. Optional standby and full-screen transcript preserved. Floating captions are still subject to Android permission restrictions. Real Moto e13 testing pending." --prerelease
            fi
            gh release upload "$tag" "$RUNNER_TEMP/$name" --clobber
            gh release view "$tag" --json url,assets --jq '{url:.url, assets:[.assets[].name]}'
          } 2>&1 | tee "$RUNNER_TEMP/publish.log"
