name: Build Chinese OCR Android APK
on:
  push:
    branches: [chinese-ocr-android-build]
    paths:
      - 'ChineseOCR-Android/**'
      - '.github/workflows/build-chinese-ocr-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android command-line tools and platform
        run: |
          set -eux
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fLsS --retry 3 -o /tmp/android-cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Bundle original MinerU 4 PP-OCRv6 ONNX models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ChineseOCR-Android/app/src/main/assets
          curl -fL --retry 3 --max-time 180 -o ChineseOCR-Android/app/src/main/assets/mineru-det.onnx https://huggingface.co/opendatalab/MinerU-4_models_onnx/resolve/main/OCR/paddleocr/ch_PP-OCRv6_tiny_det_infer.onnx
          curl -fL --retry 3 --max-time 180 -o ChineseOCR-Android/app/src/main/assets/mineru-rec.onnx https://huggingface.co/opendatalab/MinerU-4_models_onnx/resolve/main/OCR/paddleocr/ch_PP-OCRv6_small_rec_infer.onnx
          test "$(stat -c%s ChineseOCR-Android/app/src/main/assets/mineru-det.onnx)" -gt 1700000
          test "$(stat -c%s ChineseOCR-Android/app/src/main/assets/mineru-rec.onnx)" -gt 20000000
      - name: Compile offline debug APK
        working-directory: ChineseOCR-Android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChineseOCRPinyin-GalaxyA16-APK
          path: ChineseOCR-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
