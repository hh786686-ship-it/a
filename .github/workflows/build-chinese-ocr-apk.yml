name: Build Chinese OCR Android APK
on:
  push:
    branches: [chinese-ocr-android-build]
    paths:
      - 'ChineseOCR-Android/**'
      - '.github/workflows/build-chinese-ocr-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android command-line tools and platform
        run: |
          set -eux
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fLsS --retry 3 -o /tmp/android-cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Run exported Word formatting regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/word-style-test
          javac -encoding UTF-8 -d /tmp/word-style-test ChineseOCR-Android/app/src/main/java/com/example/chineseocr/WordStyles.java ChineseOCR-Android/app/src/main/java/com/example/chineseocr/PixelWordStyle.java ChineseOCR-Android/tests/WordStylesTest.java ChineseOCR-Android/tests/PixelWordStyleTest.java
          java -cp /tmp/word-style-test com.example.chineseocr.WordStylesTest /tmp/word-style-test/regression.docx
          java -cp /tmp/word-style-test com.example.chineseocr.PixelWordStyleTest
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          p='/tmp/word-style-test/regression.docx'
          with ZipFile(p) as z:
            assert z.testzip() is None
            root=ET.fromstring(z.read('word/document.xml'))
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          assert len(root.findall('.//w:ruby',ns))==6
          print('PASS ZIP integrity, valid Word XML and 6 ruby units')
          PY
      - name: Bundle original MinerU 4 PP-OCRv6 ONNX models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ChineseOCR-Android/app/src/main/assets
          curl -fL --retry 3 --max-time 180 -o ChineseOCR-Android/app/src/main/assets/mineru-det.onnx https://huggingface.co/opendatalab/MinerU-4_models_onnx/resolve/main/OCR/paddleocr/ch_PP-OCRv6_tiny_det_infer.onnx
          curl -fL --retry 3 --max-time 180 -o ChineseOCR-Android/app/src/main/assets/mineru-rec.onnx https://huggingface.co/opendatalab/MinerU-4_models_onnx/resolve/main/OCR/paddleocr/ch_PP-OCRv6_small_rec_infer.onnx
          test "$(stat -c%s ChineseOCR-Android/app/src/main/assets/mineru-det.onnx)" -gt 1700000
          test "$(stat -c%s ChineseOCR-Android/app/src/main/assets/mineru-rec.onnx)" -gt 20000000
          curl -fL --retry 3 --max-time 120 -o ChineseOCR-Android/app/src/main/assets/ppocrv6_dict.txt https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/dict/ppocrv6_dict.txt
          python3 - <<'PY'
          p='ChineseOCR-Android/app/src/main/assets/ppocrv6_dict.txt'
          with open(p,encoding='utf-8') as f: chars=f.read().splitlines()
          assert len(chars)+2==18710, f'Vocabulary count mismatch: {len(chars)}'
          print('PASS official recognition dictionary,',len(chars),'characters')
          PY
      - name: Test real MinerU OCR on a Chinese image
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          python3 -m pip install --quiet numpy pillow onnxruntime==1.23.2
          python3 ChineseOCR-Android/tests/mineru_real_ocr_test.py
      - name: Compile offline debug APK
        working-directory: ChineseOCR-Android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChineseOCRPinyin-GalaxyA16-APK
          path: ChineseOCR-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
