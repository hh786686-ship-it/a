name: Build Chinese OCR Android APK
on:
  push:
    branches: [chinese-ocr-android-build]
    paths:
      - 'ChineseOCR-Android/**'
      - '.github/workflows/build-chinese-ocr-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile offline debug APK
        working-directory: ChineseOCR-Android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChineseOCRPinyin-GalaxyA16-APK
          path: ChineseOCR-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
