plugins {
  id 'com.android.application'
  id 'com.chaquo.python'
}
android {
 namespace 'com.example.fullmineruprobe'
 compileSdk 35
 defaultConfig {
   applicationId 'com.example.fullmineruprobe'
   minSdk 26
   targetSdk 34
   ndk { abiFilters 'arm64-v8a' }
   versionCode 1
   versionName '0.0.0-standard-install-probe'
 }
}
chaquopy {
 defaultConfig {
  version '3.12'
  pip {
   install 'mineru>=4.0,<5'
  }
 }
}
